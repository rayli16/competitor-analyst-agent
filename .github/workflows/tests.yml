name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the local dev venv. The Dockerfile runs 3.14 — worth
          # aligning the two once 3.14 is confirmed for every pinned package.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Unit tests only — no API keys in CI, no network calls, no cost.
      # The real-API discovery eval (evals/) is run by hand, not here.
      - run: pytest -q
